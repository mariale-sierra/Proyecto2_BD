services:
  
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: proy3
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tienda
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
        - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

volumes:
  postgres_data: